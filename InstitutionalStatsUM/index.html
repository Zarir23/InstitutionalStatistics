<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Institutional Statistics  | Universitas Negeri Malang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-left">
        <img class="logo-um" src="assets/logo-um.png" alt="Logo Universitas Negeri Malang">
      </div>

      <div class="nav-title">
        <strong>Institutional Statistics</strong>
        <span>Universitas Negeri Malang · 2024–2023</span>
      </div>

      <div class="brand-right">
        <img class="logo-monev" src="assets/logo-monev.png" alt="Logo Perencanaan dan Monitoring Evaluasi Universitas Negeri Malang">
      </div>
    </div>
  </header>

  <main class="main">
    <div class="wrap">
      <section class="data-section" aria-labelledby="tableTitle">
        <div class="table-title-row">
          <div class="title-block">
            <div class="section-kicker">Rekapitulasi</div>
            <h2 id="tableTitle">Institutional statistics</h2>
          </div>
          <div class="header-chip year-chip">Tahun 2024</div>
          <div class="header-chip year-chip">Tahun 2023</div>
          <div class="header-chip change-chip">Year-on-year change from 2023</div>
        </div>

        <div class="table-wrap">
          <table>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    Sumber data: Institutional_Statistics_2024_2023.xlsx · Data bersifat hanya-baca.
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
